# SEIT DER ÜBUNG „KOMPATIBILITÄT“ IST DER CODE AUF JAVA 21 ANGEKOMMEN: Alle Brüche sind
# behoben, übersetzt wird mit --release 21. Die Pipeline baut deshalb streng auf beiden
# Kurs-JDKs – jeder fehlschlagende Test bricht den Lauf ab. Java 8 prüft sie nicht mehr:
# Der Code nutzt jetzt APIs, die es dort nicht gibt.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Bauen und testen auf JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Bauen und testen
        run: ./mvnw -B -ntp verify
