# DER ALTBESTAND LIEF AUF JAVA 8 – das prüft der erste Job, und er muss grün sein.
#
# Der zweite Job ist eine BESTANDSAUFNAHME: derselbe, unveränderte Code auf JDK 21 und
# JDK 25. Fehlschlagende Tests brechen ihn nicht ab, sondern landen in der
# Zusammenfassung des Laufs – sie sind der Lernstoff des Moduls „kompatibilitaet“.
# Auf den Lösungsbranches wandert die Pipeline mit dem Code auf die neuen JDKs.
#
# Der dritte Job prüft das Profil „jdk8“: Maven auf JDK 21, die Tests über Toolchains auf
# JDK 8 – so, wie es Teilnehmende mit einem zusätzlichen JDK 8 aufrufen.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java-8:
    name: Altbestand auf Java 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Bauen und testen
        run: mvn -B -ntp verify

  toolchain-jdk8:
    name: Stand vorher über Toolchains (Tests auf JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Beide landen in ~/.m2/toolchains.xml; Maven selbst läuft auf dem letzten.
          java-version: |
            8
            21
          cache: maven
      - name: Bauen und testen
        run: mvn -B -ntp verify -Pjdk8

  bestandsaufnahme:
    name: Bestandsaufnahme auf JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Bauen und testen, ohne bei Testfehlern abzubrechen
        run: mvn -B -ntp -fae verify -Dmaven.test.failure.ignore=true
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Was auf JDK ${{ matrix.java }} bricht"
            echo
            echo "Unveränderter Code, übersetzt mit \`--release 8\`."
            echo
            echo "| Modul | Testklasse |"
            echo "|-------|------------|"
            for bericht in $(grep -l -E '<(failure|error)' $(find . -path '*/target/surefire-reports/TEST-*.xml') 2>/dev/null); do
              modul=${bericht%%/target/*}
              klasse=$(basename "$bericht" .xml)
              echo "| \`${modul#./}\` | \`${klasse#TEST-}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
