# DER ALTBESTAND LIEF AUF JAVA 8 – das prüft der erste Job, und er muss grün sein.
#
# Der zweite Job ist eine BESTANDSAUFNAHME: derselbe, unveränderte Code auf JDK 21 und
# JDK 25. Fehlschlagende Tests brechen ihn nicht ab, sondern landen in der
# Zusammenfassung des Laufs – sie sind der Lernstoff des Moduls „kompatibilitaet“.
# Auf den Lösungsbranches wandert die Pipeline mit dem Code auf die neuen JDKs.
#
# Der dritte Job prüft das Profil „jdk8“: Maven auf JDK 21, die Tests über Toolchains auf
# JDK 8 – so, wie es Teilnehmende mit einem zusätzlichen JDK 8 aufrufen.
#
# AUF EINEM LÖSUNGSBRANCH (loesung/«modul») laufen diese drei Jobs nicht: Dort ist ein
# Modul hochgestellt, und auf JDK 8 übersetzt es nicht mehr. Stattdessen prüft der Job
# „Lösung“ genau dieses Modul streng auf JDK 21 und 25 – die übrigen Module brechen
# dort weiter, wie auf main. Steht das Modul auf einem Release über 21, läuft es nur
# auf JDK 25.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java-8:
    name: Altbestand auf Java 8
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'loesung/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Bauen und testen
        run: mvn -B -ntp verify

  toolchain-jdk8:
    name: Stand vorher über Toolchains (Tests auf JDK 8)
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'loesung/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Beide landen in ~/.m2/toolchains.xml; Maven selbst läuft auf dem letzten.
          java-version: |
            8
            21
          cache: maven
      - name: Bauen und testen
        run: mvn -B -ntp verify -Pjdk8

  bestandsaufnahme:
    name: Bestandsaufnahme auf JDK ${{ matrix.java }}
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'loesung/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Bauen und testen, ohne bei Testfehlern abzubrechen
        run: mvn -B -ntp -fae verify -Dmaven.test.failure.ignore=true
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Was auf JDK ${{ matrix.java }} bricht"
            echo
            echo "Unveränderter Code, übersetzt mit \`--release 8\`."
            echo
            echo "| Modul | Testklasse |"
            echo "|-------|------------|"
            for bericht in $(grep -l -E '<(failure|error)' $(find . -path '*/target/surefire-reports/TEST-*.xml') 2>/dev/null); do
              modul=${bericht%%/target/*}
              klasse=$(basename "$bericht" .xml)
              echo "| \`${modul#./}\` | \`${klasse#TEST-}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  loesung:
    name: Lösung auf JDK ${{ matrix.java }}
    if: ${{ startsWith(github.head_ref || github.ref_name, 'loesung/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Das Modul der Lösung bauen und testen
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          modul=$(find kompatibilitaet neuerungen schwerpunkte -mindepth 1 -maxdepth 1 -type d -name "${BRANCH#loesung/}" | head -n 1)
          if [ -z "$modul" ]; then
            echo "Kein Modul zu $BRANCH gefunden – baue das ganze Projekt."
            mvn -B -ntp verify
            exit
          fi
          # Ein Modul auf Release 25 übersetzt kein JDK 21 – dann entfällt dieser Lauf.
          release=$(sed -n 's:.*<maven.compiler.release>\([0-9]*\)</maven.compiler.release>.*:\1:p' "$modul/pom.xml" | head -n 1)
          if [ -n "$release" ] && [ "$release" -gt "${{ matrix.java }}" ]; then
            echo "Release $release in $modul braucht ein neueres JDK als ${{ matrix.java }} – übersprungen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Ein Schwerpunkt besteht aus mehreren Teilen (packaging pom) – dann alle bauen.
          if grep -q '<packaging>pom</packaging>' "$modul/pom.xml"; then
            mvn -B -ntp verify -f "$modul/pom.xml"
          else
            mvn -B -ntp verify -pl "$modul" -am
          fi
